name: Bug report
description: Report a reproducible tapediff problem.
title: 'Bug: '
body:
  - type: markdown
    attributes:
      value: 'Use synthetic data. Never attach keys or unreviewed tapes. Report vulnerabilities privately using SECURITY.md.'
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Node version, provider and SDK version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact command, minimal synthetic agent, and setup steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: Include exit code and reviewed output. Remove sensitive data.
    validations:
      required: true
