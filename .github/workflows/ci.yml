name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r examples/python-openai/requirements.txt
      - run: python -m venv examples/python-langgraph/.venv
      - if: runner.os != 'Windows'
        run: examples/python-langgraph/.venv/bin/python -m pip install -r examples/python-langgraph/requirements.txt
      - if: runner.os == 'Windows'
        run: examples/python-langgraph/.venv/Scripts/python -m pip install -r examples/python-langgraph/requirements.txt
      - run: python -m unittest discover -s clients/python -v
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm ci --prefix examples/ts-anthropic
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  package:
    name: Package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:package
      - run: npm audit --omit=dev --audit-level=high
