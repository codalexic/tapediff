name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m pip install -r examples/python-openai/requirements.txt
      - run: node scripts/release-notes.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm ci --prefix examples/ts-anthropic
      - run: npm test
      - run: npm run test:package
      - run: npm audit --omit=dev --audit-level=high
      - name: Publish to npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "tapediff@$version" version >/dev/null 2>&1; then
            echo "tapediff@$version is already on npm, skipping publish"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
