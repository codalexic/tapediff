<title id="title">tapediff show tapes/paris.tape</title>
<desc id="desc">Actual tapediff CLI output from the committed Python example tapes. Mock model data; costs and timings are illustrative, not benchmarks.</desc>
<rect width="1080" height="356" rx="12" fill="#0d1117"/>
<path d="M12 0h1056q12 0 12 12v28H0V12Q0 0 12 0" fill="#21262d"/>
<circle cx="22" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="66" cy="20" r="6" fill="#28c840"/>
<g font-family="'DejaVu Sans Mono',Consolas,'Liberation Mono',monospace" font-size="16"><text x="24" y="70" xml:space="preserve"><tspan fill="#e6edf3" font-weight="400" opacity="1">$ tapediff show tapes/paris.tape</tspan></text>
<text x="24" y="92" xml:space="preserve"></text>
<text x="24" y="114" xml:space="preserve"><tspan fill="#76e3ea" font-weight="400" opacity="1">» system: &quot;You are a concise trip helper. Use get_weather and convert_currency before answering.&quot;</tspan></text>
<text x="24" y="136" xml:space="preserve"><tspan fill="#76e3ea" font-weight="400" opacity="1">» user: &quot;Plan a day in Paris. What is the weather, and what is 100 USD in EUR?&quot;</tspan></text>
<text x="24" y="158" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700" opacity="1">#1  gpt-4.1-nano  100→25 tok  $0.00002  18ms</tspan></text>
<text x="24" y="180" xml:space="preserve"><tspan fill="#76e3ea" font-weight="400" opacity="1">    → tool_call get_weather {&quot;city&quot;:&quot;Paris&quot;}</tspan></text>
<text x="24" y="202" xml:space="preserve"><tspan fill="#76e3ea" font-weight="400" opacity="1">    ← tool_result get_weather {&quot;city&quot;:&quot;Paris&quot;,&quot;condition&quot;:&quot;sunny&quot;,&quot;temperature_c&quot;:22}</tspan></text>
<text x="24" y="224" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700" opacity="1">#2  gpt-4.1-nano  100→25 tok  $0.00002  2ms</tspan></text>
<text x="24" y="246" xml:space="preserve"><tspan fill="#76e3ea" font-weight="400" opacity="1">    → tool_call convert_currency {&quot;amount&quot;:100,&quot;from&quot;:&quot;USD&quot;,&quot;to&quot;:&quot;EUR&quot;}</tspan></text>
<text x="24" y="268" xml:space="preserve"><tspan fill="#76e3ea" font-weight="400" opacity="1">    ← tool_result convert_currency {&quot;amount&quot;:92,&quot;currency&quot;:&quot;EUR&quot;}</tspan></text>
<text x="24" y="290" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700" opacity="1">#3  gpt-4.1-nano  100→25 tok  $0.00002  2ms</tspan></text>
<text x="24" y="312" xml:space="preserve"><tspan fill="#7ee787" font-weight="400" opacity="1">✓ final: &quot;Paris: sunny, 22 C. Your 100 USD is 92 EUR. Enjoy a walk by the Seine.&quot;</tspan></text>
<text x="24" y="334" xml:space="preserve"><tspan fill="#e6edf3" font-weight="400" opacity="0.7">total: 3 calls · 375 tokens · $0.00006 · 22ms</tspan></text></g>
